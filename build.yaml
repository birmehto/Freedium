# build_runner configuration.
#
# `.env` is a hidden file, which build_runner does not track by default, so an
# edit to it would not regenerate `lib/core/config/env.g.dart` on an incremental
# build. Listing it here makes envied regenerate whenever the ids change.
targets:
  $default:
    sources:
      - $package$
      - lib/**
      - .env*
