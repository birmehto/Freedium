name: freedium
description: "Free, open-source reader that unlocks Medium articles — paste a link, hit Unlock, and read every story clutter-free."
publish_to: "none"
version: 1.2.0+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
  intl: ^0.20.3
  share_plus: ^13.3.1
  receive_sharing_intent: ^1.9.0
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  google_fonts: ^9.0.0
  package_info_plus: ^10.2.2
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  webview_flutter: ^4.14.1
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  fake_async: ^1.3.3

  webview_flutter_platform_interface: any
flutter:
  uses-material-design: true
