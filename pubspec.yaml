name: freedium
description: "Free, open-source Material 3 Expressive reader that unlocks Medium articles — paste a link, hit Unlock, and read every story clutter-free."
publish_to: "none"
version: 1.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.2.0-beta.3
  intl: ^0.20.3
  share_plus: ^13.3.0
  get: ^4.7.3
  receive_sharing_intent: ^1.9.0
  material_3_expressive: ^1.1.3
  material_ui: ^1.4.0
  package_info_plus: ^10.2.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
