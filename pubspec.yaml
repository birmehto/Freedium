publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  flutter_inappwebview: ^6.1.5
  intl: ^0.20.3
  share_plus: ^13.3.0
  get: ^4.7.3
