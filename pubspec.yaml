  receive_sharing_intent: ^1.9.0
  material_3_expressive: ^1.1.2
  material_ui: 1.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
